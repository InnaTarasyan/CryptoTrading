version: '3.8'

services:
  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: crypto_php
    working_dir: /var/www
    volumes:
      - ..:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: crypto_nginx
    ports:
      - "9090:80"
    volumes:
      - ..:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: crypto_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crypto_db
      MYSQL_USER: crypto_user
      MYSQL_PASSWORD: secret
    ports:
      - "3304:3306"
    volumes:
      - mysql-data:/var/lib/mysql   # ✅ persists DB on your PC

volumes:
  mysql-data: